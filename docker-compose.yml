x-database-environment: &database-environment
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  APP_ENVIRONMENT: ${APP_ENVIRONMENT:?APP_ENVIRONMENT is required}

x-storage-environment: &storage-environment
  ASSET_STORAGE_BACKEND: ${ASSET_STORAGE_BACKEND:?ASSET_STORAGE_BACKEND is required}
  GENERATED_STORAGE_ROOT: ${GENERATED_STORAGE_ROOT:-/app/storage/generated}
  OSS_ENDPOINT: ${OSS_ENDPOINT:-}
  OSS_INTERNAL_ENDPOINT: ${OSS_INTERNAL_ENDPOINT:-}
  OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-}
  OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
  OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
  OSS_SECURITY_TOKEN: ${OSS_SECURITY_TOKEN:-}
  OSS_PREFIX: ${OSS_PREFIX:-thinktv/generated}
  OSS_CNAME: ${OSS_CNAME:-false}
  OSS_SIGNED_URL_EXPIRE_SECONDS: ${OSS_SIGNED_URL_EXPIRE_SECONDS:-3600}

x-provider-limits-environment: &provider-limits-environment
  PROVIDER_CONNECT_TIMEOUT_SECONDS: ${PROVIDER_CONNECT_TIMEOUT_SECONDS:-15}
  PROVIDER_READ_TIMEOUT_SECONDS: ${PROVIDER_READ_TIMEOUT_SECONDS:-300}
  GENERATED_ASSET_MAX_BYTES: ${GENERATED_ASSET_MAX_BYTES:-31457280}
  USER_IMAGE_UPLOAD_MAX_BYTES: ${USER_IMAGE_UPLOAD_MAX_BYTES:-20971520}
  GENERATION_INPUT_IMAGES_MAX_TOTAL_BYTES: ${GENERATION_INPUT_IMAGES_MAX_TOTAL_BYTES:-104857600}
  PROVIDER_RESPONSE_MAX_BYTES: ${PROVIDER_RESPONSE_MAX_BYTES:-50331648}
  PROVIDER_MAX_OUTPUTS: ${PROVIDER_MAX_OUTPUTS:-4}

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migration:
    build:
      context: ./backend
    command: ["sh", "-c", "python -m app.runtime validate migration && alembic upgrade head"]
    environment:
      <<: *database-environment
      THINKTV_LEGACY_OWNER_ID: ${THINKTV_LEGACY_OWNER_ID:-}
      THINKTV_LEGACY_PROJECT_ID: ${THINKTV_LEGACY_PROJECT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      <<: [*database-environment, *storage-environment, *provider-limits-environment]
      MODEL_API_BASE_URL: ${MODEL_API_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:?JWT_EXPIRE_MINUTES is required}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:?AUTH_COOKIE_SECURE is required}
      USER_MODEL_CREDENTIALS_SECRET: ${USER_MODEL_CREDENTIALS_SECRET:?USER_MODEL_CREDENTIALS_SECRET is required}
      AUTH_RATE_LIMIT_ATTEMPTS: ${AUTH_RATE_LIMIT_ATTEMPTS:-5}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-60}
      AUTH_TRUSTED_PROXY_CIDRS: ${AUTH_TRUSTED_PROXY_CIDRS:?AUTH_TRUSTED_PROXY_CIDRS is required}
    depends_on:
      migration:
        condition: service_completed_successfully
    volumes:
      - generated_assets:/app/storage/generated
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["sh", "-c", "python -m app.runtime validate worker && exec python -m app.worker"]
    environment:
      <<: [*database-environment, *storage-environment, *provider-limits-environment]
      USER_MODEL_CREDENTIALS_SECRET: ${USER_MODEL_CREDENTIALS_SECRET:?USER_MODEL_CREDENTIALS_SECRET is required}
      GENERATION_WORKER_POLL_SECONDS: ${GENERATION_WORKER_POLL_SECONDS:-1}
      GENERATION_LEASE_SECONDS: ${GENERATION_LEASE_SECONDS:-90}
      GENERATION_HEARTBEAT_SECONDS: ${GENERATION_HEARTBEAT_SECONDS:-30}
      GENERATION_MAX_ATTEMPTS: ${GENERATION_MAX_ATTEMPTS:-3}
      TRASH_RETENTION_DAYS: ${TRASH_RETENTION_DAYS:-30}
      TRASH_PURGE_INTERVAL_SECONDS: ${TRASH_PURGE_INTERVAL_SECONDS:-300}
    depends_on:
      migration:
        condition: service_completed_successfully
    volumes:
      - generated_assets:/app/storage/generated
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:?FRONTEND_PORT is required}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default:
        ipv4_address: ${FRONTEND_PROXY_IP:-172.30.0.10}
    restart: unless-stopped

  admin-backend:
    build:
      context: ./backend
    command: ["sh", "-c", "python -m app.runtime validate admin-api && exec uvicorn app.admin_main:app --host 0.0.0.0 --port 8001"]
    environment:
      <<: *database-environment
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}
      ADMIN_JWT_EXPIRE_MINUTES: ${ADMIN_JWT_EXPIRE_MINUTES:?ADMIN_JWT_EXPIRE_MINUTES is required}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:?ADMIN_COOKIE_SECURE is required}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    depends_on:
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/admin-api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  admin-frontend:
    build:
      context: ./admin-frontend
    ports:
      - "${ADMIN_FRONTEND_PORT:?ADMIN_FRONTEND_PORT is required}:80"
    depends_on:
      admin-backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  generated_assets:

networks:
  default:
    ipam:
      config:
        - subnet: ${APP_NETWORK_SUBNET:-172.30.0.0/24}
