map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    # 为 20 MiB 图片文件及 multipart 边界预留少量空间；精确限制由后端校验。
    client_max_body_size 21m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
    }

    location = /studio.html {
        add_header Cache-Control "public, max-age=600, must-revalidate" always;
        try_files /studio.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        try_files /index.html =404;
    }

    location / {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|webp|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
