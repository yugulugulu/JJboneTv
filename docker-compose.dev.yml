services:
  # Development-only overrides. Keep docker-compose.yml production-oriented.
  migration:
    volumes:
      - ./backend:/app

  backend:
    command:
      - sh
      - -c
      - python -m app.runtime validate user-api && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    volumes:
      - ./backend:/app
      - generated_assets:/app/storage/generated
    environment:
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}

  image-worker:
    command:
      - sh
      - -c
      - python -m app.runtime validate worker && exec watchfiles --filter python 'python -m app.worker --role image' /app/app
    volumes:
      - ./backend:/app
      - generated_assets:/app/storage/generated
    environment:
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}

  video-worker:
    command:
      - sh
      - -c
      - python -m app.runtime validate worker && exec watchfiles --filter python 'python -m app.worker --role video' /app/app
    volumes:
      - ./backend:/app
      - generated_assets:/app/storage/generated
    environment:
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}

  admin-backend:
    command:
      - sh
      - -c
      - python -m app.runtime validate admin-api && exec uvicorn app.admin_main:app --host 0.0.0.0 --port 8001 --reload --reload-dir /app/app
    volumes:
      - ./backend:/app
    environment:
      WATCHFILES_FORCE_POLLING: ${WATCHFILES_FORCE_POLLING:-true}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command:
      - sh
      - -c
      - npm ci && npm run dev -- --host 0.0.0.0 --port 80
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}

  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile.dev
    command:
      - sh
      - -c
      - npm ci && npm run dev -- --host 0.0.0.0 --port 80
    volumes:
      - ./admin-frontend:/app
      - admin_frontend_node_modules:/app/node_modules
    working_dir: /app
    environment:
      ADMIN_API_PROXY_TARGET: http://admin-backend:8001
      VITE_USE_POLLING: ${VITE_USE_POLLING:-true}

volumes:
  frontend_node_modules:
  admin_frontend_node_modules:
